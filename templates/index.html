{% load static %}
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чебоксары: карта времени</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<header>
  <h1>Чебоксары: карта времени</h1>
  <nav>
    <a href="{% url 'people' %}">Люди</a>
    <a href="{% url 'events' %}">События</a>
    <form action="{% url 'search' %}" class="inline">
      <input type="search" name="q" placeholder="Поиск" aria-label="Поиск">
    </form>
    {% if user.is_authenticated %}
      <a href="{% url 'suggest_place' %}">+ Место</a>
      <a href="{% url 'suggest_person' %}">+ Человек</a>
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button>Выйти</button></form>
    {% else %}
      <a href="{% url 'login' %}">Войти</a>
      <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>
  <aside id="panel">
    <div id="filters"></div>
    <div id="card"><p class="hint">Выберите место на карте.</p></div>
    <p class="hint"><a href="{% url 'rules' %}">Правила</a> · <a href="{% url 'privacy' %}">Конфиденциальность</a></p>
  </aside>
  <div id="map"></div>
</main>
<footer>
  <label for="year">Год: <output id="year-out">2026</output></label>
  <input id="year" type="range" min="1469" max="2026" value="2026">
</footer>
<dialog id="photo-dlg">
  <img id="photo-img" alt="">
  <p id="photo-cap"></p>
  <p><a id="photo-link" target="_blank" rel="noopener">Открыть на PastVu</a>
     · <button type="button" id="photo-close">Закрыть</button></p>
</dialog>
<dialog id="cmp-dlg">
  <p class="cmp-controls">
    <select id="cmp-a" aria-label="Левое фото"></select>
    <select id="cmp-b" aria-label="Правое фото"></select>
  </p>
  <div id="cmp">
    <img id="cmp-img-b" alt="">
    <img id="cmp-img-a" alt="">
  </div>
  <input id="cmp-range" type="range" min="0" max="100" value="50" aria-label="Положение шторки">
  <p><button type="button" id="cmp-close">Закрыть</button></p>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>const IS_STAFF = {{ user.is_staff|yesno:"true,false" }};</script>
<script src="{% static 'app.js' %}"></script>
</body>
</html>
