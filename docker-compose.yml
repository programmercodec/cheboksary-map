services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cheb
      POSTGRES_USER: cheb
      POSTGRES_PASSWORD: cheb
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata: